<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architectural Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #1a1a2e;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: #333;
        }
        
        p {
            color: #666;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui">
        <h1>🏗️ Architectural Visualizer</h1>
        <p>Drag to rotate • Scroll to zoom</p>
        <p>3D Building Visualization</p>
    </div>
    
    <script type="module" src="src/app.js"></script>
</body>
</html>
